<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEO - Aprender jugando</title><style>body{margin:0;font-family:system-ui;background:linear-gradient(#cce9ff,#fff4d9);color:#164875;text-align:center}main{max-width:520px;margin:auto;padding:16px}h1{font-size:48px;color:#1978dd;margin:8px}#stage{background:#fff9;border-radius:24px;padding:12px;perspective:700px}#boy{font-size:130px;display:block;transition:transform .8s;animation:bob 2s infinite}@keyframes bob{50%{translate:0 -8px}}button{font-size:17px;border:0;border-radius:16px;padding:14px;margin:5px;background:#2385e7;color:white;font-weight:bold;cursor:pointer}section{background:white;border-radius:18px;padding:15px;margin:12px 0}#answers button{background:#f7b846;color:#253a5e}input{padding:12px;border-radius:12px;border:1px solid #b4cce6;width:65%}</style><main><h1>TEO ⭐</h1><b>Tu compañero de aprendizaje</b><div id="stage"><span id="boy">👦🏻</span><p id="speech">¡Hola! Soy TEO. ¡Vamos a jugar!</p><button onclick="turn()">🔄 Girar</button><button onclick="say('¡Hola! ¡Qué lindo aprender con vos!')">👋 Saludar</button><button onclick="talk()">🔊 Escuchar</button></div><section><h2>⭐ Estrellas: <span id="score">0</span></h2><button onclick="game('math')">🔢 Matemática</button><button onclick="game('focus')">🎯 Atención</button><button onclick="game('memory')">🧠 Memoria</button><button onclick="game('parents')">👨‍👩‍👧 Familias</button><div id="activity">Elegí un juego para empezar.</div><div id="answers"></div></section><section><input id="question" placeholder="Preguntale a TEO..."><button onclick="ask()">Enviar</button></section></main><script>let angle=0,points=0,last='¡Hola! Soy TEO.',correct=0;function say(t){last=t;document.getElementById('speech').textContent=t}function talk(){if('speechSynthesis'in window){speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(last);s.lang='es-AR';speechSynthesis.speak(s)}}function turn(){angle+=90;document.getElementById('boy').style.transform='rotateY('+angle+'deg)';say('¡Estoy girando!')}function quiz(q,options,answer){correct=answer;document.getElementById('activity').textContent=q;document.getElementById('answers').innerHTML='';options.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(i===correct){points++;document.getElementById('score').textContent=points;say('¡Muy bien! ¡Ganaste una estrella! ⭐');document.getElementById('activity').textContent='🌟 ¡Excelente!'}else{say('¡Buen intento! Probá otra vez.')}};document.getElementById('answers').append(b)})}function game(k){if(k==='math')quiz('¿Cuánto es 8 + 4?',['10','12','14'],1);if(k==='focus')quiz('¿Cuál es diferente?',['🐱','🐱','🐶','🐱'],2);if(k==='memory'){document.getElementById('activity').textContent='Recordá: 🍎 🐸 ⭐';document.getElementById('answers').innerHTML='';setTimeout(()=>quiz('¿Qué animal viste?',['🐶','🐸','🐱'],1),3000)}if(k==='parents'){document.getElementById('activity').textContent='Acompañen 10 minutos por día. Feliciten el esfuerzo y permitan descansos.';document.getElementById('answers').innerHTML=''}}function ask(){let q=document.getElementById('question').value.toLowerCase();let a=q.includes('hola')?'¡Hola! ¡Qué alegría verte!':q.includes('nombre')?'Me llamo TEO.':q.includes('triste')?'Podés contarle cómo te sentís a un adulto de confianza.':q.includes('matem')?'¡Elegí el juego de Matemática!':'¡Qué buena pregunta! Probemos uno de mis juegos.';say(a);talk();document.getElementById('question').value=''}</script></html>
